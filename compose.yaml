name: if3110-k02-09-security
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: local-postgres-admin
      POSTGRES_DB: platform_target
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - ./scripts/postgres-init.sql:/docker-entrypoint-initdb.d/01-app.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d platform_target"]
      interval: 3s
      timeout: 3s
      retries: 30
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: local-mysql-admin
      MYSQL_DATABASE: platform_target
      MYSQL_USER: platform
      MYSQL_PASSWORD: local-target-password
    ports:
      - "127.0.0.1:53306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 3s
      timeout: 3s
      retries: 60
  mariadb:
    image: mariadb:11.4
    environment:
      MARIADB_ROOT_PASSWORD: local-mariadb-admin
      MARIADB_DATABASE: platform_target
      MARIADB_USER: platform
      MARIADB_PASSWORD: local-target-password
    ports:
      - "127.0.0.1:53307:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 3s
      timeout: 3s
      retries: 60
