name: if3110-k02-09
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Jalankan scripts/dev-env.sh}
      POSTGRES_DB: postgres
      INTERNAL_DATABASE_PASSWORD: ${INTERNAL_DATABASE_PASSWORD:?Jalankan scripts/dev-env.sh}
      TARGET_EXECUTOR_PASSWORD: ${TARGET_EXECUTOR_PASSWORD:?Jalankan scripts/dev-env.sh}
      TARGET_AUDIT_PASSWORD: ${TARGET_AUDIT_PASSWORD:?Jalankan scripts/dev-env.sh}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - ./scripts/postgres-init.sh:/docker-entrypoint-initdb.d/01-platform.sh:ro
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d atlas_internal"]
      interval: 3s
      timeout: 3s
      retries: 30
  mariadb:
    image: mariadb:11.4
    profiles: ["bonus"]
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ADMIN_PASSWORD:?Jalankan scripts/dev-env.sh}
      TARGET_EXECUTOR_PASSWORD: ${TARGET_EXECUTOR_PASSWORD:?Jalankan scripts/dev-env.sh}
      TARGET_AUDIT_PASSWORD: ${TARGET_AUDIT_PASSWORD:?Jalankan scripts/dev-env.sh}
    ports:
      - "127.0.0.1:53307:3306"
    volumes:
      - ./scripts/mariadb-init.sh:/docker-entrypoint-initdb.d/01-target.sh:ro
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 3s
      timeout: 3s
      retries: 60
volumes:
  postgres-data:
  mariadb-data:
